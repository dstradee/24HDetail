<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Admin - 24H Detailing</title>
    
    <!-- Tipografías de Alta Gama -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- CONFIGURACIÓN TAILWIND (STEALTH LUXURY) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0B0C0E',

                        platinum: '#F3F4F6',
                        muted: '#9CA3AF',

                        bodytext: '#D1D5DB'

                        luxury: '0.08em',

        body { background-color: #0B0C0E; -webkit-tap-highlight-color: transparent; overflow-x: hidden; }

</head>
<body class="text-bodytext font-sans min-h-screen flex flex-col pb-32">

    <!-- LOGIN ADMIN -->
    <div id="login-view" class="fixed inset-0 z-50 bg-obsidian flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-md bg-basalt p-8 rounded-arch border border-slateborder">
            <div class="text-center mb-8">
                <i class="ph-light ph-terminal-window text-5xl text-platinum mb-4 inline-block"></i>
                <h2 class="text-xl font-display font-light uppercase tracking-luxury text-platinum">Terminal <br><span class="font-semibold text-white">Administrador</span></h2>

            <div class="space-y-6">

                    <label class="block text-[10px] font-display uppercase tracking-luxury text-muted mb-3">Identificador (Correo)</label>

                </div>

                <button onclick="loginAdmin()" id="btn-login" class="w-full bg-white text-obsidian font-display font-semibold uppercase tracking-cta py-4 rounded-arch mt-6 active:scale-[0.98] transition-transform">

                </button>
            </div>
        </div>
    </div>

    <!-- PANEL ADMIN (DASHBOARD) -->
    <div id="admin-dashboard" class="hidden flex-1 flex flex-col max-w-6xl mx-auto w-full p-4 md:p-8">
        <!-- HEADER -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-basalt p-6 rounded-arch border border-slateborder mb-8 gap-6">
            <div class="flex items-center gap-4">
                <i class="ph-light ph-car-profile text-3xl text-platinum"></i>
                <div>
                    <h1 class="text-lg font-display font-semibold uppercase tracking-luxury text-platinum">SYS.v1.0</h1>
                    <p class="text-[9px] font-display uppercase tracking-widest text-muted">24H Detailing Control</p>
                </div>
            </div>
            
            <div class="flex w-full sm:w-auto border border-slateborder rounded-arch p-1 bg-obsidian">
                <button onclick="switchTab('citas')" id="tab-citas" class="flex-1 sm:flex-none px-6 py-3 rounded-arch font-display font-semibold uppercase tracking-widest text-[9px] bg-white text-obsidian transition-colors">Agenda</button>
                <button onclick="switchTab('socios')" id="tab-socios" class="flex-1 sm:flex-none px-6 py-3 rounded-arch font-display font-semibold uppercase tracking-widest text-[9px] text-muted hover:text-platinum transition-colors">Flotas</button>
            </div>
            
            <button onclick="logoutAdmin()" class="text-muted hover:text-white text-[10px] font-display uppercase tracking-luxury transition-colors flex items-center gap-2">

        <!-- SECCIÓN 1: CALENDARIO Y CITAS -->
        <div id="section-citas" class="grid md:grid-cols-12 gap-8 relative">
            <!-- CALENDARIO -->
            <div class="md:col-span-5 lg:col-span-4 bg-basalt p-6 rounded-arch border border-slateborder h-fit md:sticky md:top-8 z-10">

                <div id="admin-placeholder" class="h-full flex flex-col items-center justify-center text-muted py-20">

                <div id="admin-time-selection" class="hidden">

                    <i class="ph-light ph-buildings"></i> Nuevo Perfil Corporativo
                </h2>
                <div class="space-y-6 mt-6">
                    <div><label class="block text-[10px] font-display uppercase tracking-luxury text-muted mb-3">Razón Social / Empresa</label><input type="text" id="new-socio-name" class="w-full bg-obsidian border border-slateborder rounded-arch px-4 py-3 text-platinum text-sm focus:outline-none focus:border-platinum transition-colors"></div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-[10px] font-display uppercase tracking-luxury text-muted mb-3">Usuario</label><input type="text" id="new-socio-user" class="w-full bg-obsidian border border-slateborder rounded-arch px-4 py-3 text-platinum text-sm focus:outline-none focus:border-platinum transition-colors"></div>
                        <div><label class="block text-[10px] font-display uppercase tracking-luxury text-muted mb-3">Clave</label><input type="text" id="new-socio-pass" class="w-full bg-obsidian border border-slateborder rounded-arch px-4 py-3 text-platinum text-sm focus:outline-none focus:border-platinum transition-colors"></div>
                    </div>

                    <div class="border-t border-slateborder pt-6">

                        <div class="grid grid-cols-3 gap-3">
                            <div><label class="block text-[9px] font-display uppercase text-muted mb-2 text-center">Exterior</label><input type="number" id="new-socio-p1" class="w-full bg-obsidian border border-slateborder rounded-arch px-2 py-3 text-center text-platinum text-sm outline-none focus:border-platinum"></div>
                            <div><label class="block text-[9px] font-display uppercase text-muted mb-2 text-center">Interior</label><input type="number" id="new-socio-p2" class="w-full bg-obsidian border border-slateborder rounded-arch px-2 py-3 text-center text-platinum text-sm outline-none focus:border-platinum"></div>
                            <div><label class="block text-[9px] font-display uppercase text-muted mb-2 text-center">Completo</label><input type="number" id="new-socio-p3" class="w-full bg-obsidian border border-slateborder rounded-arch px-2 py-3 text-center text-platinum text-sm outline-none focus:border-platinum"></div>
                        </div>
                    </div>

                    <div class="border-t border-slateborder pt-6">
                        <label class="block text-[10px] font-display uppercase tracking-luxury text-muted mb-4">Logotipo (Opcional)</label>
                        <input type="file" id="new-socio-logo" accept="image/*" class="w-full text-xs text-muted file:mr-4 file:py-2 file:px-4 file:rounded-arch file:border file:border-slateborder file:bg-obsidian file:text-platinum hover:file:bg-basalt file:text-[10px] file:font-display file:uppercase file:cursor-pointer transition-colors cursor-pointer">
                    </div>

                    <button id="btn-crear-socio" onclick="createSocio()" class="w-full bg-white text-obsidian font-display font-semibold uppercase tracking-cta py-4 rounded-arch mt-6 active:scale-[0.98] transition-transform">
                        Registrar Perfil
                    </button>
                </div>
            </div>

            <!-- DASHBOARD DE SOCIOS -->
            <div class="md:col-span-7 lg:col-span-8 bg-basalt p-6 rounded-arch border border-slateborder">
                <h2 class="text-sm font-display font-semibold uppercase tracking-luxury text-platinum mb-6 border-b border-slateborder pb-4">
                    Directorio Operativo
                </h2>
                <div id="socios-list-container" class="max-h-[700px] overflow-y-auto pr-2 space-y-6">
                    <div class="text-center py-10 text-muted"><i class="ph-light ph-spinner animate-spin text-3xl"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BARRA FLOTANTE DE ACCIONES (CITAS) -->
    <div id="action-bar" class="fixed bottom-0 left-0 w-full bg-obsidian/95 backdrop-blur-md border-t border-slateborder p-4 transform translate-y-full transition-transform duration-300 z-40">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <button onclick="deselectAll()" class="text-muted hover:text-white transition-colors"><i class="ph-light ph-x text-2xl"></i></button>
                <div>
                    <p class="text-sm font-display uppercase tracking-luxury text-platinum"><span id="selected-count" class="font-bold text-white">0</span> franjas</p>
                    <p class="text-[9px] font-display uppercase tracking-widest text-muted mt-1">Pendientes de instrucción</p>
                </div>
            </div>
            <div class="flex gap-3 w-full sm:w-auto">
                <button onclick="executeBulkAction('unblock')" class="flex-1 sm:flex-none bg-transparent border border-slateborder text-platinum font-display font-semibold uppercase tracking-cta py-3 px-8 rounded-arch active:scale-[0.98] transition-all hover:border-platinum text-[10px]">
                    Liberar
                </button>
                <button onclick="executeBulkAction('block')" class="flex-1 sm:flex-none bg-white text-obsidian font-display font-semibold uppercase tracking-cta py-3 px-8 rounded-arch active:scale-[0.98] transition-transform text-[10px]">
                    Bloquear
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMACIONES MULTIUSOS -->
    <div id="admin-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center bg-obsidian/90 backdrop-blur-md px-6">
        <div class="bg-basalt p-8 rounded-arch w-full max-w-sm border border-slateborder transform scale-95 opacity-0 transition-all" id="admin-modal-box">
            <h3 class="text-lg font-display uppercase tracking-luxury text-platinum mb-4" id="admin-modal-title">Título</h3>
            <div class="text-bodytext text-sm mb-8 leading-relaxed whitespace-pre-line font-sans" id="admin-modal-message">Mensaje</div>
            <div class="flex gap-4" id="admin-modal-buttons"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://kujtlvfqxghhidlgxzbn.supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_KGhnhvQ3gG6mmzUMxxCfPQ_OwmvHjgo"; 
        const TELEGRAM_TOKEN = "8611178436:AAHXGFqtenGl00Rvrgqk0dZIHEfuUCgY6-o";
        const CHAT_ID = "6519651464";

        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let selectedDateStr = ""; let selectedSlotsMap = new Map();
        let globalStats = {}; let globalSocios = [];

        let displayAdminMonth = new Date().getMonth();
        let displayAdminYear = new Date().getFullYear();

        const ALL_HOURS = []; for (let h = 0; h < 24; h++) { let hs = h.toString().padStart(2, '0'); ALL_HOURS.push(`${hs}:00`, `${hs}:30`); }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                renderAdminCalendar(); setupRealtime(); loadSocios();
            }
        });

        async function loginAdmin() {
            const email = document.getElementById('admin-email').value; const password = document.getElementById('admin-pass').value;
            document.getElementById('btn-login').innerHTML = "Verificando..."; document.getElementById('btn-login').disabled = true;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').textContent = "Credenciales no válidas.";
                document.getElementById('login-error').classList.remove('hidden');
                document.getElementById('btn-login').textContent = "Autorizar Acceso"; document.getElementById('btn-login').disabled = false;
            } else window.location.reload();
        }
        async function logoutAdmin() { await supabaseClient.auth.signOut(); window.location.reload(); }

        function switchTab(tab) {
            document.getElementById('section-citas').classList.add('hidden');
            document.getElementById('section-socios').classList.add('hidden');
            
            document.getElementById('tab-citas').className = "flex-1 sm:flex-none px-6 py-3 rounded-arch font-display font-semibold uppercase tracking-widest text-[9px] bg-transparent text-muted hover:text-platinum transition-colors";
            document.getElementById('tab-socios').className = "flex-1 sm:flex-none px-6 py-3 rounded-arch font-display font-semibold uppercase tracking-widest text-[9px] bg-transparent text-muted hover:text-platinum transition-colors";
            
            document.getElementById(`section-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 sm:flex-none px-6 py-3 rounded-arch font-display font-semibold uppercase tracking-widest text-[9px] bg-white text-obsidian transition-colors";
            
            if(tab === 'citas') updateActionBar(); else document.getElementById('action-bar').classList.add('translate-y-full');
            if(tab === 'socios') loadSocios();
        }

        // ========================================================
        // GESTIÓN DE SOCIOS
        // ========================================================
        async function loadSocios() {
            const container = document.getElementById('socios-list-container');
            container.innerHTML = '<div class="text-center py-10 text-muted"><i class="ph-light ph-spinner animate-spin text-3xl"></i></div>';
            
            const { data: socios, error: errS } = await supabaseClient.from('socios').select('*').order('created_at', { ascending: false });
            const { data: citas, error: errC } = await supabaseClient.from('citas').select('socio_id, estado, fecha').not('socio_id', 'is', null);

            if (errS) { container.innerHTML = '<p class="text-red-400 text-[10px] font-display uppercase tracking-widest text-center">Error de sistema</p>'; return; }
            if (socios.length === 0) { container.innerHTML = '<p class="text-muted text-[10px] font-display uppercase tracking-widest text-center py-6">Directorio vacío.</p>'; return; }
            
            globalStats = {}; globalSocios = socios;
            socios.forEach(s => globalStats[s.id] = { pendientes: 0, completados: 0 });
            if(citas) {
                citas.forEach(c => {
                    if(globalStats[c.socio_id]) {
                        if(c.estado === 'pendiente') globalStats[c.socio_id].pendientes++;
                        else globalStats[c.socio_id].completados++;
                    }
                });
            }

            let html = `
                <div class="mb-8 border-b border-slateborder pb-6">
                    <button onclick="sendGlobalReport()" class="w-full bg-white text-obsidian font-display font-semibold uppercase tracking-cta py-4 rounded-arch active:scale-[0.98] transition-transform">
                        Transmitir Reporte Global
                    </button>
                </div>
                <div class="space-y-6">
            `;

            socios.forEach(s => {
                const p = globalStats[s.id].pendientes;
                const c = globalStats[s.id].completados;
                
                const logoHtml = s.logo_url 
                    ? `<img src="${s.logo_url}" class="w-10 h-10 rounded-arch object-cover grayscale opacity-80 border border-slateborder">`
                    : `<div class="w-10 h-10 bg-obsidian border border-slateborder text-muted rounded-arch flex items-center justify-center"><i class="ph-light ph-buildings text-xl"></i></div>`;

                html += `
                <div class="bg-obsidian border border-slateborder p-6 rounded-arch">
                    <div class="flex justify-between items-start gap-4 mb-6 border-b border-slateborder pb-4">
                        <div class="flex items-center gap-4">
                            ${logoHtml}
                            <div>
                                <h4 class="font-display font-light uppercase tracking-luxury text-platinum text-sm">${s.company_name}</h4>
                                <p class="text-[9px] font-display uppercase tracking-widest text-muted mt-1">ID: <span class="text-platinum">${s.username}</span> | Pwd: <span class="text-platinum">${s.password}</span></p>
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="editSocio('${s.id}', '${s.company_name}', ${s.precio_fuera}, ${s.precio_dentro}, ${s.precio_completo})" class="text-muted hover:text-platinum p-2 transition-colors"><i class="ph-light ph-pencil-simple text-lg"></i></button>
                            <button onclick="deleteSocio('${s.id}', '${s.company_name}')" class="text-muted hover:text-white p-2 transition-colors"><i class="ph-light ph-trash text-lg"></i></button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-2 mb-6">
                        <div class="bg-basalt border border-slateborder p-3 rounded-arch text-center">
                            <span class="block text-[9px] uppercase font-display tracking-widest text-muted mb-1">EXT</span>
                            <span class="font-sans text-sm text-platinum">${s.precio_fuera || 0}€</span>
                        </div>
                        <div class="bg-basalt border border-slateborder p-3 rounded-arch text-center">
                            <span class="block text-[9px] uppercase font-display tracking-widest text-muted mb-1">INT</span>
                            <span class="font-sans text-sm text-platinum">${s.precio_dentro || 0}€</span>
                        </div>
                        <div class="bg-basalt border border-slateborder p-3 rounded-arch text-center">
                            <span class="block text-[9px] uppercase font-display tracking-widest text-muted mb-1">COMP</span>
                            <span class="font-sans text-sm text-platinum">${s.precio_completo || 0}€</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mb-6">
                        <div class="bg-transparent border border-slateborder p-4 rounded-arch flex justify-between items-center">
                            <span class="text-[9px] font-display uppercase tracking-widest text-muted">Ejecutado</span>
                            <span class="font-sans text-lg text-platinum">${c}</span>
                        </div>
                        <div class="bg-transparent border border-slateborder p-4 rounded-arch flex justify-between items-center">
                            <span class="text-[9px] font-display uppercase tracking-widest text-muted">Activo</span>
                            <span class="font-sans text-lg text-platinum">${p}</span>
                        </div>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="sendIndividualReport('${s.company_name}', ${p}, ${c})" class="flex-1 bg-basalt border border-slateborder hover:border-platinum text-platinum text-[9px] font-display uppercase tracking-widest py-3 rounded-arch transition-colors">
                            Resumen Ops
                        </button>
                        <button onclick="openCleanupModal('${s.id}', '${s.company_name}')" class="flex-1 bg-basalt border border-slateborder hover:border-platinum text-platinum text-[9px] font-display uppercase tracking-widest py-3 rounded-arch transition-colors">
                            Purgar Datos
                        </button>
                    </div>
                </div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        async function createSocio() {
            const name = document.getElementById('new-socio-name').value.trim();
            const user = document.getElementById('new-socio-user').value.trim();
            const pass = document.getElementById('new-socio-pass').value.trim();
            const p1 = document.getElementById('new-socio-p1').value || 0;
            const p2 = document.getElementById('new-socio-p2').value || 0;
            const p3 = document.getElementById('new-socio-p3').value || 0;
            const logoFile = document.getElementById('new-socio-logo').files[0];

            if(!name || !user || !pass) return showAdminModal("Incompleto", "Identificador y Clave son mandatorios.", ()=>{});
            
            const btn = document.getElementById('btn-crear-socio');
            btn.innerHTML = `Procesando...`; btn.disabled = true;

            let finalLogoUrl = null;
            if (logoFile) {
                const fileExt = logoFile.name.split('.').pop();
                const fileName = `logo_${Date.now()}.${fileExt}`;
                try {
                    const { data, error } = await supabaseClient.storage.from('logos').upload(fileName, logoFile);
                    if (!error) {
                        const { data: urlData } = supabaseClient.storage.from('logos').getPublicUrl(fileName);
                        finalLogoUrl = urlData.publicUrl;
                    }
                } catch(e) {}
            }
            
            const { error } = await supabaseClient.from('socios').insert([{ 
                company_name: name, username: user, password: pass, 
                precio_fuera: p1, precio_dentro: p2, precio_completo: p3, logo_url: finalLogoUrl
            }]);

            if(error) showAdminModal("Error de Sistema", "Colisión de identificador.", ()=>{});
            else {

        function openCleanupModal(socioId, name) {
            const htmlMessage = `
                <p class="mb-6 text-bodytext text-sm font-sans">Selecciona el rango de datos ejecutados a purgar.</p>
                <select id="cleanup-timeframe" class="w-full bg-obsidian border border-slateborder rounded-arch px-4 py-4 text-platinum text-sm focus:outline-none focus:border-platinum outline-none appearance-none">
                    <option value="1">Registros de > 30 días</option>
                    <option value="2">Registros de > 60 días</option>
                    <option value="all">Purgado Total de Historial</option>
                </select>
            `;
            showAdminModal(`Limpieza: ${name}`, htmlMessage, async () => {
                const val = document.getElementById('cleanup-timeframe').value;
                let query = supabaseClient.from('citas').delete().eq('socio_id', socioId).eq('estado', 'completado');
                if (val !== 'all') {
                    const d = new Date(); d.setMonth(d.getMonth() - parseInt(val));
                    const dateThreshold = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    query = query.lt('fecha', dateThreshold);
                }
                await query; loadSocios(); 
            }, true); 
        }
